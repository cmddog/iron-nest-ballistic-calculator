<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <meta
      content="Ballistics calculator for Iron Nest. Enter distance and shell type to instantly calculate required elevation angle and time of flight."
      name="description"
    />

    <meta content="Iron Nest Ballistics Calculator" property="og:title" />
    <meta
      content="Quickly calculate required elevation for artillery shots in Iron Nest."
      property="og:description"
    />
    <meta content="website" property="og:type" />
    <meta content="https://iron-nest.shiru.dog" property="og:url" />
    <meta content="https://iron-nest.com/preview.png" property="og:image" />

    <link href="https://iron-nest.shiru.dog" rel="canonical" />
    <link href="/favicon.ico" rel="icon" type="image/svg+xml" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Iron Nest Ballistics Calculator</title>
  </head>
  <body>
    <script src="/src/main.ts" type="module"></script>
    <svg style="display: none" xmlns="http://www.w3.org/2000/svg">
      <symbol id="icon-calculator" viewBox="0 0 9 9">
        <path d="M1,3H2V4H3V3H4V2H3V1H2V2H1z" fill="currentColor" />
        <rect fill="currentColor" height="1" width="3" x="5" y="2" />
        <rect fill="currentColor" height="1" width="1" x="1" y="5" />
        <rect fill="currentColor" height="1" width="1" x="3" y="5" />
        <path d="M6,6H5V7H6V8H7V7H8V6H7V5H6z" fill="currentColor" />
        <rect fill="currentColor" height="1" width="1" x="2" y="6" />
        <rect fill="currentColor" height="1" width="1" x="1" y="7" />
        <rect fill="currentColor" height="1" width="1" x="3" y="7" />
      </symbol>
    </svg>

    <main class="crt">
      <div class="scroll-wrapper">
        <div class="inner-wrapper">
          <div class="bounding-box-outer header">
            <div class="bounding-box">
              <h1>IRON NEST BALLISTICS CALCULATOR</h1>
            </div>
            <p class="subtitle">
              >> Assured compatible with v1.0
            </p>
          </div>
          <form id="calculator" novalidate>
            <div class="distance bounding-box-outer">
              <label for="distance">
                > DISTANCE
                <span class="bounding-box input-with-unit">
                  <input
                    class="ghost-input"
                    id="distance"
                    inputmode="numeric"
                    name="distance"
                    type="text"
                  />
                  <span class="value-display" data-field="distance">00.00</span>
                  <span>km</span>
                </span>
              </label>
            </div>
            <div class="bearing bounding-box-outer">
              <label for="bearing">
                > BEARING
                <span class="bounding-box input-with-unit">
                  <input
                    class="ghost-input"
                    id="bearing"
                    inputmode="numeric"
                    name="bearing"
                    type="text"
                  />
                  <span class="value-display" data-field="bearing">000.00</span>
                  <span>deg</span>
                </span>
              </label>
            </div>
            <div class="shell-type bounding-box-outer">
              <label for="shell-type">
                > Shell Type
                <span id="shell-type-prediction"></span>
                <input
                  class="bounding-box input-with-unit"
                  id="shell-type"
                  maxlength="20"
                  name="bearing"
                  oninput="this.value = this.value.toUpperCase()"
                  type="text"
                />
              </label>
            </div>
            <div class="label bounding-box-outer">
              <label for="label">
                > Label
                <input
                  class="bounding-box input-with-unit"
                  id="label"
                  maxlength="20"
                  name="bearing"
                  placeholder="TARGET"
                  type="text"
                />
              </label>
            </div>
            <div class="charges-outer">
              > CHARGES
              <div class="charges">
                <button class="charge-button bounding-box">1</button>
                <button class="charge-button bounding-box">2</button>
                <button class="charge-button bounding-box">3</button>
                <button class="charge-button bounding-box">4</button>
                <button class="charge-button bounding-box">5</button>
                <button class="charge-button bounding-box">6</button>
              </div>
            </div>
            <div class="result bounding-box-outer">
              <p>> CALCULATED ELEVATION (DEG)</p>
              <div class="bounding-box" id="result-container">
                <div class="dim" id="result-numbers">
                  <div class="result-error"></div>
                  <span class="elevation-display"
                    ><span class="elevation-display" id="elevation-value"
                      >00.00</span
                    >°</span
                  >
                  <span><span id="tta-value">00.00</span>s to arrive</span>
                </div>

                <div class="hr" style="width: 90%"></div>

                <div class="calculate-button-wrapper">
                  <button
                    aria-label="Calculate"
                    class="bounding-box"
                    id="btn-calculate"
                    type="button"
                  >
                    <svg>
                      <use href="#icon-calculator" />
                    </svg>
                  </button>
                  <button
                    aria-label="Calculate and queue"
                    class="bounding-box"
                    id="btn-calculate-and-queue"
                    type="button"
                  >
                    <svg>
                      <use href="#icon-calculator" />
                    </svg>
                    & Queue
                  </button>
                </div>
              </div>
            </div>
          </form>
          <div id="queue"></div>
        </div>
      </div>
    </main>
  </body>
</html>
